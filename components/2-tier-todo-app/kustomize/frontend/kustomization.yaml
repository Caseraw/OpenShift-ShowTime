apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-frontend

resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml

images:
  - name: quay.io/rh-ee-kamirsar/2-tier-to-do-app
    newTag: frontend-0.1.0

labels:
  - pairs:
      app.kubernetes.io/name: todo-frontend
      app.kubernetes.io/part-of: 2-tier-todo-app
      app.kubernetes.io/component: frontend
    includeSelectors: true
