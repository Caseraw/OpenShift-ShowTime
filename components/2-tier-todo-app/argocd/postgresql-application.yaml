apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-postgresql
  labels:
    app.kubernetes.io/name: todo-postgresql
    app.kubernetes.io/part-of: 2-tier-todo-app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Caseraw/OpenShift-ShowTime.git
    targetRevision: main
    path: components/2-tier-todo-app/kustomize/postgresql
  destination:
    # Argo CD cluster secret name for OpenShift on-prem (patch for your environment).
    name: on-prem
    namespace: todo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
