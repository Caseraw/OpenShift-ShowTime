<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-Tier To Do</title>
  <style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.5rem; }
  form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  input[type="text"] { flex: 1; padding: 0.5rem; }
  button { padding: 0.5rem 0.75rem; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
  li.done span { text-decoration: line-through; color: #888; }
  .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>2-Tier To Do</h1>
  <p>Frontend on ROSA · Database on OpenShift on-prem</p>

  <form id="add-form">
    <input type="text" id="title" placeholder="New to do..." required>
    <button type="submit">Add</button>
  </form>
  <p id="error" class="error" hidden></p>
  <ul id="todos"></ul>

  <script>
  const list = document.getElementById("todos");
  const errorEl = document.getElementById("error");

  function showError(message) {
    errorEl.textContent = message;
    errorEl.hidden = !message;
  }

  async function api(path, options) {
    const response = await fetch(path, {
      headers: { "Content-Type": "application/json" },
      ...options,
    });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error || response.statusText);
    }
    if (response.status === 204) return null;
    return response.json();
  }

  async function loadTodos() {
    showError("");
    try {
      const todos = await api("/api/todos");
      list.innerHTML = "";
      todos.forEach((todo) => {
        const li = document.createElement("li");
        li.className = todo.done ? "done" : "";
        li.innerHTML = `
          <input type="checkbox" ${todo.done ? "checked" : ""}>
          <span>${todo.title}</span>
          <button type="button">Delete</button>
        `;
        li.querySelector("input").addEventListener("change", async () => {
          await api(`/api/todos/${todo.id}`, {
            method: "PUT",
            body: JSON.stringify({ done: !todo.done }),
          });
          loadTodos();
        });
        li.querySelector("button").addEventListener("click", async () => {
          await api(`/api/todos/${todo.id}`, { method: "DELETE" });
          loadTodos();
        });
        list.appendChild(li);
      });
    } catch (err) {
      showError(err.message);
    }
  }

  document.getElementById("add-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const input = document.getElementById("title");
    try {
      await api("/api/todos", {
        method: "POST",
        body: JSON.stringify({ title: input.value }),
      });
      input.value = "";
      loadTodos();
    } catch (err) {
      showError(err.message);
    }
  });

  loadTodos();
  </script>
</body>
</html>
