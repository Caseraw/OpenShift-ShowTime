site_name: OpenShift ShowTime
site_description: Reusable OpenShift platform scenarios built from composable components.
site_url: https://caseraw.github.io/OpenShift-ShowTime/
repo_url: https://github.com/Caseraw/OpenShift-ShowTime
repo_name: Caseraw/OpenShift-ShowTime
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - Concepts:
      - Overview: concepts/overview.md
      - Components: concepts/components.md
      - Scenarios: concepts/scenarios.md
      - BYO: concepts/byo.md
  - Catalog:
      - Scenarios:
          - Hub and spoke (RHACM): scenarios/hub-spoke-acm.md
      - Components:
          - RHACM install: components/rhacm-install.md
          - 2-tier To Do app: components/2-tier-todo-app.md
  - Project layout: project-layout.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
